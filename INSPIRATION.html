<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CadOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box }

    /*
     * ── GRADE VERTICAL ───────────────────────────────────────────
     *
     * Toda a tipografia do editor obedece à mesma unidade: --step.
     * As linhas do papel são desenhadas com esse step.
     * Qualquer line-height deve ser múltiplo exato de --step.
     *
     *   Parágrafo  →  1 × --step  =  36px
     *   H2, H3     →  1 × --step  =  36px  (tamanho muda, step não)
     *   H1         →  2 × --step  =  72px
     *
     * --top-offset alinha a primeira linha do papel com a
     * primeira linha de texto. Deve ser igual a --pad-top.
     * --pad-left deve sempre ser maior que --margin-x.
     *
     * ─────────────────────────────────────────────────────────── */
    :root {
      --step: 36px;

      --topbar-height: 52px;
      --sidebar-width: 236px;

      --line-thickness: 1.5px;
      --top-offset: 18px;   /* = --pad-top: alinha grade com texto */
      --margin-x: 74px;     /* < --pad-left */

      --pad-left: 98px;
      --pad-right: 36px;
      --pad-top: 18px;      /* = --top-offset */

      --font-ui: system-ui, -apple-system, sans-serif;
      --font-content: 'EB Garamond', Georgia, serif;

      --size-body: 20px;    /* linha-height = 1 × --step */
      --size-h1:   36px;    /* linha-height = 2 × --step */
      --size-h2:   26px;    /* linha-height = 1 × --step */
      --size-h3:   21px;    /* linha-height = 1 × --step */
    }

    html[data-theme="claro"] {
      --bg:        #e6e1d9;
      --topbar:    #ddd8d0;
      --sidebar:   #e1dcd4;
      --paper:     #f0ebe2;
      --text:      #201c13;
      --subtext:   #574f43;
      --muted:     #8a7e6e;
      --line-blue: rgba(55, 100, 168, .30);
      --line-red:  rgba(158, 40, 40, .22);
      --divide:    rgba(0, 0, 0, .08);
      --hover:     #d4cfc8;
      --active:    #cac5be;
      --tool-bg:   #d9d4cc;
      --tool-hover:#cec9c2;
      --input-bg:  #e6e1d9;
      --selection: rgba(55, 100, 168, .08);
      --accent:    #3a6aad;
      --accent-fg: #fff;
    }

    html[data-theme="escuro"] {
      --bg:        #0d0c0a;
      --topbar:    #0a0908;
      --sidebar:   #111009;
      --paper:     #121109;
      --text:      #c8bba4;
      --subtext:   #7d7264;
      --muted:     #524940;
      --line-blue: rgba(80, 120, 175, .15);
      --line-red:  rgba(155, 65, 45, .14);
      --divide:    rgba(255, 255, 255, .05);
      --hover:     #1b1a16;
      --active:    #21201b;
      --tool-bg:   #18170f;
      --tool-hover:#1e1d14;
      --input-bg:  #0d0c0a;
      --selection: rgba(80, 120, 175, .10);
      --accent:    #7496bc;
      --accent-fg: #0a0908;
    }

    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font-ui);
    }
    body { overflow: hidden }

    /* ── TOPBAR ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-height);
      z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      background: var(--topbar);
      border-bottom: 1px solid var(--divide);
    }

    .topbar-left { min-width: 0 }
    .topbar-title {
      margin: 0;
      font-size: 15px; font-weight: 600; letter-spacing: .02em;
      color: var(--text);
    }
    .topbar-subtitle {
      margin: 2px 0 0;
      font-size: 11px; color: var(--muted); letter-spacing: .01em;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px }

    /* ── SIDEBAR ── */
    .sidebar {
      position: fixed; top: var(--topbar-height); left: 0; bottom: 0;
      width: var(--sidebar-width);
      overflow: auto; padding: 16px 10px;
      background: var(--sidebar);
      border-right: 1px solid var(--divide);
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px 18px;
    }
    .brand-mark {
      width: 26px; height: 26px; flex: 0 0 auto;
      border-radius: 5px;
      border: 1.5px solid var(--muted);
      opacity: .45;
    }
    .brand-title  { margin: 0; font-size: 13px; font-weight: 600; color: var(--text) }
    .brand-subtitle { margin: 2px 0 0; font-size: 11px; color: var(--muted) }

    .nav-group { margin-top: 6px }
    .nav-label {
      padding: 4px 10px 3px;
      font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--muted);
    }
    .nav-item {
      display: block; width: 100%;
      padding: 8px 10px;
      border: 0; border-radius: 7px;
      background: transparent; color: var(--subtext);
      text-align: left; cursor: pointer;
      font-size: 13px; font-weight: 500;
      font-family: var(--font-ui);
      transition: background .1s, color .1s;
    }
    .nav-item:hover  { background: var(--hover);  color: var(--text) }
    .nav-item.active { background: var(--active); color: var(--text); font-weight: 600 }

    .theme-btn {
      padding: 6px 12px;
      border: 1px solid var(--divide);
      border-radius: 6px;
      background: transparent; color: var(--subtext);
      font-size: 12px; font-weight: 500; cursor: pointer;
      font-family: var(--font-ui);
      transition: background .1s, color .1s;
    }
    .theme-btn:hover { background: var(--hover); color: var(--text) }

    /* ── MAIN ── */
    .main {
      position: fixed;
      top: var(--topbar-height); left: var(--sidebar-width); right: 0; bottom: 0;
      overflow: auto; background: var(--bg);
    }
    .main-inner { max-width: 880px; min-height: 100%; margin: 0 auto }

    /* ── PAPER ── */
    .paper {
      position: relative;
      min-height: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    /*
     * Grade: linhas a cada --step com offset --top-offset.
     * Margem vermelha vertical em --margin-x.
     * Ambas usam a mesma variável de espessura --line-thickness.
     */
    .paper::before {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(var(--step) - var(--line-thickness)),
          var(--line-blue) calc(var(--step) - var(--line-thickness)),
          var(--line-blue) var(--step)
        ),
        linear-gradient(
          to right,
          transparent var(--margin-x),
          var(--line-red) var(--margin-x),
          var(--line-red) calc(var(--margin-x) + var(--line-thickness)),
          transparent calc(var(--margin-x) + var(--line-thickness))
        );
      background-position: 0 var(--top-offset), 0 0;
    }

    .editor-shell {
      position: relative; z-index: 1;
      padding: var(--pad-top) var(--pad-right) 48px var(--pad-left);
    }

    /* ── EDITORJS RESET ── */
    #editorjs { min-height: calc(100vh - var(--topbar-height) - 40px) }
    .codex-editor__redactor { padding-bottom: 0 !important }
    .ce-block, .ce-block__content { margin: 0 !important }
    .ce-block__content, .ce-toolbar__content { max-width: 100% }
    .ce-block__content > * { margin: 0 !important }

    /*
     * GRADE: font-family e line-height controlados aqui.
     * Não altere line-height sem ajustar --step.
     */
    .ce-paragraph, .cdx-list, .cdx-list__item, .ce-header {
      margin: 0 !important;
      color: var(--text) !important;
      font-family: var(--font-content) !important;
      gap: 0 !important;
    }

    .ce-paragraph {
      min-height: var(--step);           /* 1 × --step */
      padding: 0 !important;
      font-size: var(--size-body) !important;
      line-height: var(--step) !important;
    }

    .cdx-list, .cdx-list__item {
      font-size: var(--size-body) !important;
      line-height: var(--step) !important;  /* 1 × --step */
    }
    .cdx-list     { padding: 0 0 0 28px !important }
    .cdx-list__item { padding: 0 !important }

    .ce-header {
      min-height: var(--step);           /* 1 × --step */
      padding: 0 !important;
      font-weight: 600 !important;
      line-height: var(--step) !important;
    }
    h1.ce-header {
      min-height: calc(var(--step) * 2);          /* 2 × --step */
      font-size: var(--size-h1) !important;
      line-height: calc(var(--step) * 2) !important;
    }
    h2.ce-header { font-size: var(--size-h2) !important }
    h3.ce-header { font-size: var(--size-h3) !important }

    /* ── TOOLBAR OVERRIDES ── */
    .ce-toolbar__plus,
    .ce-toolbar__settings-btn,
    .ce-inline-toolbar,
    .ce-conversion-toolbar,
    .ce-popover,
    .tc-popover,
    .cdx-search-field {
      border: 0 !important;
      box-shadow: none !important;
      background: var(--tool-bg) !important;
      color: var(--text) !important;
    }
    .ce-toolbar__plus:hover,
    .ce-toolbar__settings-btn:hover,
    .ce-popover-item:hover,
    .ce-conversion-toolbar__label:hover { background: var(--tool-hover) !important }

    .cdx-input {
      border: 0 !important;
      box-shadow: none !important;
      background: var(--input-bg) !important;
      color: var(--text) !important;
    }

    .ce-block--selected .ce-block__content { background: var(--selection) !important }
    .ce-delimiter { color: var(--muted) !important }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      :root { --sidebar-width: 200px; --pad-left: 84px; --margin-x: 60px }
    }
    @media (max-width: 720px) {
      :root {
        --topbar-height: 48px; --sidebar-width: 68px;
        --pad-left: 58px; --pad-right: 16px;
        --margin-x: 38px; --size-body: 18px;
      }
      .brand-copy, .nav-label, .nav-item span, .topbar-subtitle { display: none }
      .brand { justify-content: center }
      .nav-item { text-align: center; padding: 10px 6px }
      .topbar { padding: 0 12px }
      .topbar-right { gap: 6px }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="topbar-title">CadOnline</h1>
      <p class="topbar-subtitle">Institucional (local)</p>
    </div>
    <div class="topbar-right">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar tema">Claro</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-copy">
        <p class="brand-title">Caderno</p>
        <p class="brand-subtitle">Adicione suas informações</p>
      </div>
    </div>
    <div class="nav-group">
      <div class="nav-label">Principal</div>
      <button class="nav-item active" type="button"><span>Lembretes</span></button>
    </div>
    <div class="nav-group">
      <div class="nav-label">Conteúdo</div>
      <button class="nav-item" type="button"><span>Recentes</span></button>
      <button class="nav-item" type="button"><span>Favoritos</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <section class="paper">
        <div class="editor-shell">
          <div id="editorjs"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const btn  = document.getElementById("themeBtn");

      btn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "claro" ? "escuro" : "claro";
        root.setAttribute("data-theme", next);
        btn.textContent = next === "claro" ? "Claro" : "Escuro";
      });

      if (!window.EditorJS || !window.Header || !(window.EditorjsList || window.List)) {
        console.error("Editor.js ou ferramentas não foram carregadas.");
        return;
      }

      new EditorJS({
        holder: "editorjs",
        placeholder: "Digite seu conteúdo aqui...",
        tools: {
          header: { class: window.Header, inlineToolbar: true, config: { placeholder: "Título" } },
          list:   { class: window.EditorjsList || window.List, inlineToolbar: true }
        },
        data: {
          blocks: [
            { type: "header",    data: { text: "Lib Editor.js", level: 2 } },
            { type: "paragraph", data: { text: "É só um template. Falta backend, banco, auth opcional, sincronização, muita coisa." } },
            { type: "paragraph", data: { text: "Pouco tempo pra fazer isso agora, vou deixar pra depois." } },
            { type: "paragraph", data: { text: "" } },
            { type: "header",    data: { text: "Coisas suportadas pelo Editor.js", level: 2 } },
            { type: "list",      data: { style: "unordered", items: ["Listas", "Parágrafos", "Títulos", "Check-lists", "Etc"] } }
          ]
        }
      });
    })();
  </script>
</body>
</html>
